<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#8fd0e8;--hay:#e9c46a;--dirt:#8a5a36;--burrow:#2a170b;--lip:#b07a46;--ink:#2b1a0e;--paper:#fff8e7;--pink:#e76f8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Fredoka,"Trebuchet MS",sans-serif;color:var(--ink);display:flex;flex-direction:column;background:#6a4122;overflow-x:hidden}
.sky{position:relative;z-index:0;overflow:hidden;padding-bottom:110px;background:linear-gradient(#5db3ea 0%,#9fd8f4 55%,#fff0d2 100%)}
.sun{position:absolute;right:8%;top:22px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#fff6b0 0 45%,#ffd95a 46% 100%);box-shadow:0 0 0 16px rgba(255,235,130,.35),0 0 60px 30px rgba(255,235,130,.45)}
.cloud{position:absolute;width:120px;height:36px;background:#fff;border-radius:40px;opacity:.92;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50px;height:50px;left:18px;top:-24px}.cloud::after{width:64px;height:64px;left:50px;top:-34px}
.c1{top:80px;animation-duration:70s}.c2{top:46px;scale:.7;animation-duration:95s;animation-delay:-30s}.c3{top:130px;scale:.85;animation-duration:85s;animation-delay:-55s}
@keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(calc(100vw + 180px))}}
.hills{position:absolute;left:0;right:0;bottom:0;height:100px;background:radial-gradient(ellipse 55% 100% at 18% 100%,#a6d98a 0 99%,transparent 100%),radial-gradient(ellipse 60% 100% at 80% 100%,#93cf78 0 99%,transparent 100%)}
.ground{position:relative;z-index:1;flex:1;padding:64px 0 200px;background:radial-gradient(circle at 20% 30%,rgba(0,0,0,.1) 3px,transparent 4px) 0 0/70px 70px,radial-gradient(circle at 70% 75%,rgba(255,235,200,.12) 2px,transparent 3px) 0 0/50px 50px,linear-gradient(#78b956 0 16px,#5a9441 16px 22px,#9b6b3f 22px,#6a4122 100%)}
.ground::before{content:"";position:absolute;left:0;right:0;top:-12px;height:24px;background:radial-gradient(circle at 14px 24px,#78b956 14px,transparent 15px) 0 0/28px 24px repeat-x}
.flower{position:absolute;top:-14px;pointer-events:none}
h1{position:relative;z-index:2;font-size:clamp(2rem,7vw,3.6rem);margin:0;text-align:center;padding:28px 16px 0;text-shadow:3px 3px 0 var(--paper);transform:rotate(-1.5deg)}
.sub{position:relative;z-index:2;text-align:center;margin:6px 16px 0;font-weight:600}
.hill{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:120px 18px;max-width:900px;margin:0 auto;padding:0 20px}
.hole{display:block;background:none;border:0;cursor:pointer;font:inherit;color:var(--paper);text-align:center;padding:0}
.mound{position:relative;height:60px;display:block}

.mound::before{content:"";position:absolute;left:6%;right:6%;bottom:0;height:56px;border-radius:50%;background:var(--burrow);box-shadow:0 -4px 0 var(--lip)}
.peek{position:absolute;left:50%;bottom:22px;width:100px;height:126px;margin-left:-50px;clip-path:inset(-140px -40px 0 -40px);z-index:1}
.peek svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:translateY(105%);transition:transform .35s cubic-bezier(.3,1.25,.5,1)}
.hole:hover .peek svg,.hole:focus-visible .peek svg,.hole.up .peek svg{transform:translateY(0)}
.mound::after{content:"";position:absolute;left:6%;right:6%;bottom:0;height:30px;border-radius:0 0 50% 50%/0 0 100% 100%;background:var(--lip);border-bottom:4px solid #6e4524;z-index:2}
.hole:focus-visible{outline:3px solid var(--paper);outline-offset:8px;border-radius:12px}
.label{display:block;font-weight:700;font-size:1.05rem;margin-top:14px;text-shadow:2px 2px 0 var(--burrow)}
.done .label::after{content:" ✓"}
.locked{opacity:.6;cursor:not-allowed}
.locked .label::after{content:" (locked)"}
#mascot{position:fixed;left:0;top:0;width:84px;height:118px;z-index:30;pointer-events:none;will-change:transform}
#mascotWrap{width:84px;height:118px;cursor:pointer;pointer-events:auto}
#mascotWrap svg{width:100%;height:100%;display:block;overflow:visible}
#mascot.sulk svg{filter:saturate(.5) brightness(.9)}
.frown{display:none}
#mascot.sulk .frown{display:inline}
#mascot.sulk .smile{display:none}
#mascot{--t:.6s;--amp:-5px;--sw:14deg}
#mascot[data-pose=run]{--t:.28s;--amp:-10px;--sw:30deg}
#mascot.sulk[data-pose=walk]{--t:.9s;--amp:-3px;--sw:8deg}
#mascot .head,#mascot .neck,#mascot .body{transition:transform .5s ease}
#mascot .head{transform-origin:50px 64px}
#mascot .body{transform-origin:50px 118px}
#mascot .armL{transform-origin:35px 78px}#mascot .armR{transform-origin:65px 78px}
#mascot .pupils{transform:translate(var(--lx,0px),var(--ly,0px))}
#mascot .eyes{transform-origin:50px 41px;transition:transform .08s}
#mascot.blink .eyes{transform:scaleY(.1)}
#mascot.sulk .head{transform:translateY(5px) rotate(8deg)}
#mascot[data-pose=stand] .body{animation:breathe 2.8s ease-in-out infinite}
#mascot[data-pose=run] svg,#mascot[data-pose=walk] svg{animation:lean var(--t) ease-in-out infinite alternate}
#mascot[data-pose=run] .footL,#mascot[data-pose=walk] .footL{animation:step var(--t) ease-in-out infinite alternate}
#mascot[data-pose=run] .footR,#mascot[data-pose=walk] .footR{animation:step var(--t) ease-in-out infinite alternate-reverse}
#mascot[data-pose=run] .armL,#mascot[data-pose=walk] .armL{animation:swing var(--t) ease-in-out infinite alternate}
#mascot[data-pose=run] .armR,#mascot[data-pose=walk] .armR{animation:swing var(--t) ease-in-out infinite alternate-reverse}
#mascot[data-pose=sit] .body{transform:scaleY(.8)}
#mascot[data-pose=sit] .head,#mascot[data-pose=sit] .neck{transform:translateY(11px)}
#mascot[data-pose=sit].tiltL .head{transform:translateY(11px) rotate(-15deg)}
#mascot[data-pose=sit].tiltR .head{transform:translateY(11px) rotate(15deg)}
#mascot.sulk[data-pose=sit] .head{transform:translateY(16px) rotate(8deg)}
#mascot.hop svg,#mascot.happy svg{animation:hop .5s ease-out}
#mascot.happy svg{animation-iteration-count:2}
#mascot.shake svg{animation:shk .35s}
@keyframes breathe{50%{transform:scaleY(1.025)}}
@keyframes lean{to{transform:translateY(calc(var(--amp)*.6))}}
@keyframes step{to{transform:translateY(var(--amp))}}
@keyframes swing{from{transform:rotate(calc(var(--sw)*-1))}to{transform:rotate(var(--sw))}}
@keyframes hop{40%{transform:translateY(-14px)}}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.heart{position:fixed;z-index:31;pointer-events:none;font-size:1.4rem;animation:upf 1.2s ease-out forwards}
@keyframes upf{to{transform:translateY(-70px);opacity:0}}
#bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:max-content;max-width:200px;margin-bottom:4px;pointer-events:none;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-weight:600;font-size:.9rem;box-shadow:3px 3px 0 var(--ink)}
#bubble:empty{display:none}
.overlay{position:fixed;inset:0;background:rgba(43,26,14,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.overlay.on{display:flex}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:20px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:8px 8px 0 var(--ink)}
.panel h2{margin:0 0 10px}
.x{float:right;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:50%;width:38px;height:38px;font:700 1rem Fredoka,sans-serif;cursor:pointer}
.btn{background:var(--hay);border:3px solid var(--ink);border-radius:12px;padding:9px 16px;font:700 1rem Fredoka,sans-serif;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);margin:4px 6px 4px 0}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
input[type=text]{font:600 1.1rem Fredoka,sans-serif;padding:9px 12px;border:3px solid var(--ink);border-radius:12px;width:100%;margin:10px 0;background:#fff}
.stage{height:230px;border:3px solid var(--ink);border-radius:14px;background:#d9c7a3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage img{width:100%;height:100%;object-fit:contain}
.stage .q{font-size:6rem}
.msg{min-height:1.5em;font-weight:700}
.item{border:3px solid var(--ink);border-radius:14px;margin:10px 0;background:#fff}
.item button{width:100%;text-align:left;background:none;border:0;font:700 1.05rem Fredoka,sans-serif;padding:12px 14px;cursor:pointer;color:var(--ink)}
.item p{display:none;margin:0;padding:0 14px 14px;line-height:1.55;white-space:pre-wrap}
.item.open p{display:block}
.conf{position:fixed;top:-30px;font-size:1.6rem;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.peek svg{transition:none}.conf,.heart{display:none}.cloud{animation:none}#mascot,#mascot *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky"><i class="sun"></i><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="hills"></i><h1 id="title">Happy Birthday!</h1>
<p class="sub">Tap a burrow. Someone is hiding in there.</p></div>
<div class="ground"><main class="hill" id="hill"></main></div>
<div id="mascot"><div id="bubble"></div><div id="mascotWrap"></div></div>
<div class="overlay" id="overlay"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

let G;
function gameStart(){ G = {i:0, score:0}; gameRound(); say("Your turn to guess! Don't let me down."); }
function gameRound(){
  const c = CHARS[G.i]; G.blur = 24; G.hinted = false;
  const pic = c.img ? `<img src="${c.img}" alt="Mystery character" id="pic">` : `<div class="q" id="pic">❓</div>`;
  show(`<h2>Who's that character? (${G.i+1}/${CHARS.length})</h2>
    <div class="stage">${pic}</div>
    <input type="text" id="ans" placeholder="Type the name…" autocomplete="off">
    <button class="btn" id="go">Guess</button><button class="btn" id="hint">Hint (-20)</button><button class="btn" id="skip">Skip</button>
    <p class="msg" id="gmsg">Score: ${G.score}</p>`);
  const blur = () => $("#pic") && ($("#pic").style.filter = `blur(${G.blur}px)`);
  blur(); clearInterval(G.t);
  G.t = setInterval(() => { G.blur = Math.max(0, G.blur - 1); blur(); }, 800);
  $("#go").onclick = () => guess(c);
  $("#ans").onkeydown = e => { if(e.key==="Enter") guess(c); };
  $("#hint").onclick = () => { G.hinted = true; $("#gmsg").textContent = "💡 " + c.hint; };
  $("#skip").onclick = () => { clearInterval(G.t); $("#gmsg").textContent = "It was " + c.name + "!"; setTimeout(next, 1400); };
  $("#ans").focus();
}
function guess(c){
  const v = $("#ans").value.trim().toLowerCase();
  if(!v) return;
  if(c.alias.includes(v)){
    clearInterval(G.t); $("#pic").style.filter = "blur(0)";
    const pts = Math.max(10, 50 + G.blur*3 - (G.hinted?20:0)); G.score += pts;
    $("#gmsg").textContent = `YES! ${c.name}! +${pts}`; say("She's good!"); setTimeout(next, 1400);
  } else { $("#gmsg").textContent = "Nope, try again!"; $("#ans").select(); }
}
function next(){
  G.i++;
  if(G.i < CHARS.length) return gameRound();
  const r = G.score/(CHARS.length*120);
  const title = r>.7 ? "south park boss" : r>.4 ? "south park nerd" : "you need to rewatch south park you silly fuck";
  show(`<h2>Final score: ${G.score}</h2><p><b>${title}</b></p><p>Write a personal message from you here for finishing the game.</p><button class="btn" onclick="gameStart()">Play again</button>`);
  visited.add("game"); say("Not bad at all!");
}
